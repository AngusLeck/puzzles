<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<title>Puzzles</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
<style>
  :root{
    --bg:#f4efe6; --card:#fffdf8; --ink:#2b2a33; --ink-soft:#6f6a5e; --line:#e3dccb;
    --tile-hi:#fffef9; --tile-lo:#efe7d3; --tile-ink:#33302a; --tile-edge:rgba(80,70,40,.16);
    --slot-bg:#e9e2d1; --slot-edge:#d4cab2; --accent:#b3552e; --accent-ink:#fff;
    --good:#3d8b4f; --glow:#f0b429;
    --cat-1:#f5c84c; --cat-2:#93c464; --cat-3:#7cb7e0; --cat-4:#b58fd9;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16171b; --card:#1f2127; --ink:#e9e6dd; --ink-soft:#a09a8c; --line:#2e3038;
      --slot-bg:#262931; --slot-edge:#3a3d47; --accent:#d97a4e;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height:100dvh; overscroll-behavior-y:contain;
  }
  button{font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer;}
  .wrap{max-width:640px; margin:0 auto; padding:12px 14px calc(24px + env(safe-area-inset-bottom));}

  /* ---------- list view ---------- */
  #listView h1{font-family:Georgia, "Times New Roman", serif; font-size:34px; margin:18px 2px 2px;}
  #listView .tagline{color:var(--ink-soft); margin:0 2px 18px; font-size:14px;}
  .puzzleCard{
    display:block; width:100%; text-align:left; background:var(--card);
    border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin:10px 0;
    box-shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 14px -8px rgba(0,0,0,.12);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .puzzleCard:active{transform:scale(.985);}
  .puzzleCard .cardTitle{font-weight:700; font-size:17px;}
  .puzzleCard .cardSub{color:var(--ink-soft); font-size:13px; margin-top:2px;}
  .puzzleCard .cardMeta{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .badge{font-size:12px; padding:2px 9px; border-radius:99px; border:1px solid var(--line); color:var(--ink-soft);}
  .badge.solved{background:var(--good); border-color:var(--good); color:#fff;}
  .upcomingNote{color:var(--ink-soft); font-size:13px; text-align:center; margin-top:18px;}

  /* ---------- puzzle view ---------- */
  #puzzleView header{display:flex; align-items:center; gap:8px; padding:6px 0 10px; position:sticky; top:0; background:var(--bg); z-index:50;}
  #puzzleView header .title{font-family:Georgia, serif; font-weight:700; font-size:19px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hbtn{
    border:1px solid var(--line); background:var(--card); border-radius:99px;
    padding:7px 13px; font-size:14px; font-weight:600; color:var(--ink);
    box-shadow:0 1px 2px rgba(0,0,0,.06);
  }
  .hbtn:active{transform:translateY(1px);}
  .hbtn.armed{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

  #promptCard{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 15px; font-size:15px; line-height:1.45; white-space:pre-line;
    box-shadow:0 1px 2px rgba(0,0,0,.05);
  }
  #promptCard mark{background:var(--glow); color:#3a2f00; border-radius:4px; padding:0 3px; transition:background .3s;}
  #promptCard .attribution{display:block; text-align:right; color:var(--ink-soft); font-size:12px; font-style:italic; margin-top:8px;}

  #board{position:relative; margin-top:12px; border-radius:16px; touch-action:pan-y; overflow:hidden;
    background:
      radial-gradient(1200px 500px at 50% -200px, rgba(255,255,255,.35), transparent 60%),
      var(--card);
    border:1px solid var(--line);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 1px 2px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark){
    #board{background:radial-gradient(1200px 500px at 50% -200px, rgba(255,255,255,.05), transparent 60%), var(--card);}
  }
  #board.shake{animation:boardShake .4s ease;}
  @keyframes boardShake{
    0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)}
    40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)}
  }
  #trayLine{position:absolute; left:14px; right:14px; border-top:2px dashed var(--line); opacity:.9; pointer-events:none;}
  #trayLine::after{
    content:"tile tray"; position:absolute; right:0; top:3px; font-size:10px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--ink-soft); opacity:.7;
  }
  #rowBackdrops,#slotLayer,#tileLayer,#fxLayer{position:absolute; inset:0;}
  #fxLayer{pointer-events:none; z-index:2000;}
  #tileLayer{z-index:10;} #slotLayer{z-index:2;} #rowBackdrops{z-index:1;}

  .slot{
    position:absolute; border-radius:22%;
    background:var(--slot-bg);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.14), inset 0 0 0 1.5px var(--slot-edge);
    transition:box-shadow .15s ease, background .3s ease;
  }
  .slot .slotLabel{position:absolute; top:2px; left:5px; font-size:10px; font-weight:700; color:var(--ink-soft); opacity:.8;}
  .slot .slotCenterLabel{
    position:absolute; inset:0; display:grid; place-items:center;
    font-weight:800; letter-spacing:.03em; text-transform:uppercase;
    color:var(--ink-soft); opacity:.45; pointer-events:none;
  }
  .slot.target{box-shadow:inset 0 2px 5px rgba(0,0,0,.1), inset 0 0 0 2.5px var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--slot-bg));}
  .slot.glow{box-shadow:inset 0 0 0 3px var(--glow), 0 0 14px 2px color-mix(in srgb, var(--glow) 65%, transparent); animation:glowPulse 1.1s ease infinite;}
  @keyframes glowPulse{50%{box-shadow:inset 0 0 0 3px var(--glow), 0 0 22px 5px color-mix(in srgb, var(--glow) 75%, transparent);}}

  .tile{
    position:absolute; top:0; left:0; display:grid; place-items:center;
    background:linear-gradient(178deg, var(--tile-hi) 0%, var(--tile-lo) 100%);
    color:var(--tile-ink); font-weight:800; letter-spacing:.02em; text-transform:uppercase;
    border-radius:22%; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    touch-action:none; cursor:grab; will-change:transform;
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,.75), inset 0 -2px 3px rgba(120,100,50,.14),
      0 0 0 1px var(--tile-edge), 0 2px 2px rgba(0,0,0,.14), 0 5px 9px -4px rgba(0,0,0,.28);
  }
  .tile.lifted{
    cursor:grabbing;
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,.75), inset 0 -2px 3px rgba(120,100,50,.14),
      0 0 0 1px var(--tile-edge), 0 8px 8px rgba(0,0,0,.16), 0 18px 26px -8px rgba(0,0,0,.4);
  }
  .tile.glow{box-shadow:0 0 0 3px var(--glow), 0 0 18px 3px color-mix(in srgb, var(--glow) 70%, transparent), 0 2px 2px rgba(0,0,0,.14);}
  .tile.locked{cursor:default;}

  #letterStrip{
    display:flex; flex-wrap:wrap; justify-content:center; gap:6px;
    margin-top:12px; padding:10px; background:var(--card); border:1px solid var(--line); border-radius:14px;
  }
  #letterStrip .key{
    width:32px; height:38px; border-radius:9px; font-weight:700; font-size:15px; color:var(--ink);
    background:linear-gradient(178deg, var(--tile-hi), var(--tile-lo));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 0 0 1px var(--tile-edge), 0 2px 3px rgba(0,0,0,.15);
    touch-action:manipulation; color:var(--tile-ink);
  }
  #letterStrip .key:active{transform:translateY(1.5px); box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 0 0 1px var(--tile-edge), 0 1px 1px rgba(0,0,0,.15);}
  .tips{color:var(--ink-soft); font-size:12.5px; text-align:center; margin-top:10px; line-height:1.5;}

  #trashZone{
    position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); transform:translateX(-50%) scale(.5);
    width:64px; height:64px; border-radius:50%; z-index:900;
    display:grid; place-items:center; font-size:26px;
    background:var(--card); border:2px dashed var(--ink-soft); color:var(--ink-soft);
    opacity:0; pointer-events:none; transition:transform .18s ease, opacity .18s ease, background .15s, border-color .15s, color .15s;
  }
  #trashZone.show{opacity:1; transform:translateX(-50%) scale(1);}
  #trashZone.hot{background:#c0392b; border-color:#c0392b; color:#fff; transform:translateX(-50%) scale(1.22);}

  /* ---------- solved banner ---------- */
  #solvedBanner{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin-top:12px; padding:12px 15px; border-radius:14px;
    background:color-mix(in srgb, var(--good) 14%, var(--card)); border:1.5px solid var(--good);
    font-weight:700; animation:bannerIn .45s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes bannerIn{from{transform:translateY(10px) scale(.96); opacity:0;}}
  #solvedBanner .chip{font-size:12px; font-weight:700; padding:3px 10px; border-radius:99px; color:#2b2317;}
  #solvedBanner .muted{font-weight:500; color:var(--ink-soft); font-size:13px;}
  .rowBackdrop{position:absolute; border-radius:14px; opacity:.45;}

  /* ---------- hint sheet & toast ---------- */
  #sheetScrim{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:1000; opacity:0; transition:opacity .2s;}
  #sheetScrim.open{opacity:1;}
  #hintSheet{
    position:fixed; left:0; right:0; bottom:0; z-index:1001; max-width:640px; margin:0 auto;
    background:var(--card); border-radius:20px 20px 0 0; border:1px solid var(--line); border-bottom:none;
    padding:16px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(105%); transition:transform .28s cubic-bezier(.3,1.1,.4,1);
    max-height:70dvh; overflow-y:auto;
  }
  #hintSheet.open{transform:translateY(0);}
  #hintSheet h2{margin:0 0 4px; font-family:Georgia, serif; font-size:20px;}
  #hintSheet .sheetSub{color:var(--ink-soft); font-size:13px; margin:0 0 14px;}
  .hintButtons{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .hintButtons .hbtn{flex:1; min-width:120px; text-align:center; padding:11px;}
  .hintButtons .hbtn:disabled{opacity:.45; cursor:default;}
  .revealedHint{
    display:block; width:100%; text-align:left; padding:10px 12px; border-radius:12px;
    border:1px solid var(--line); margin:8px 0; font-size:14px; line-height:1.4; color:var(--ink);
    background:var(--bg);
  }
  .revealedHint .hintSize{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); display:block; margin-bottom:2px;}
  .revealedHint .replay{color:var(--ink-soft); font-size:12px;}

  #hintToast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom));
    z-index:950; width:min(92vw, 560px);
    background:var(--ink); color:var(--bg); padding:12px 40px 12px 16px; border-radius:14px;
    font-size:14.5px; line-height:1.4; box-shadow:0 10px 30px -6px rgba(0,0,0,.5);
    animation:bannerIn .3s cubic-bezier(.2,1.3,.4,1); cursor:pointer;
  }
  #hintToast::before{content:"💡 "; }
  #hintToast .x{position:absolute; right:10px; top:8px; opacity:.6; font-size:16px;}
  [hidden]{display:none !important;}
</style>
</head>
<body>

<div class="wrap" id="listView">
  <h1>Puzzles</h1>
  <p class="tagline">Tiles &amp; slots. Drag, snap, solve.</p>
  <div id="puzzleList"></div>
  <p class="upcomingNote" id="upcomingNote" hidden></p>
</div>

<div class="wrap" id="puzzleView" hidden>
  <header>
    <button class="hbtn" id="backBtn" aria-label="Back to list">←</button>
    <div class="title" id="puzzleTitle"></div>
    <button class="hbtn" id="hintBtn">💡 Hint</button>
    <button class="hbtn" id="resetBtn" aria-label="Reset puzzle">↺</button>
  </header>
  <div id="promptCard"></div>
  <div id="solvedBanner" hidden></div>
  <div id="board">
    <div id="rowBackdrops"></div>
    <div id="slotLayer"></div>
    <div id="trayLine"></div>
    <div id="tileLayer"></div>
    <div id="fxLayer"></div>
  </div>
  <div id="letterStrip" hidden></div>
  <p class="tips" id="tipsLine"></p>
</div>

<div id="trashZone">✕</div>
<div id="sheetScrim" hidden></div>
<div id="hintSheet" hidden>
  <h2>Hints</h2>
  <p class="sheetSub">Revealed hints stay here so you can review them any time.</p>
  <div class="hintButtons" id="hintButtons"></div>
  <div id="revealedHints"></div>
</div>
<div id="hintToast" hidden><span id="hintToastText"></span><span class="x">✕</span></div>

<script src="puzzles.js"></script>
<script>
"use strict";
/* =====================================================================
   Puzzles — generic tile & slot engine
   Puzzle data lives in puzzles.js (window.PUZZLES). See README.md.
   ===================================================================== */

const PUZZLES = Array.isArray(window.PUZZLES) ? window.PUZZLES : [];
const STORAGE_KEY = "puzzles-progress-v1";
const CHAIN_GAP = 2;          // px between tiles snapped into a chain
const DRAG_START_DIST = 6;    // px of movement before a press becomes a drag
const DOUBLE_TAP_MS = 320;
const CATEGORY_COLORS = ["var(--cat-1)", "var(--cat-2)", "var(--cat-3)", "var(--cat-4)"];

const el = (id) => document.getElementById(id);
const clamp = (value, lo, hi) => Math.min(hi, Math.max(lo, value));
const escapeHtml = (text) => text.replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function loadAllProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}

/* ---------------------------------------------------------------- state */
const S = {
  open: false,
  puzzle: null,
  layout: null,          // {tileW, tileH, gap, offsetX, offsetY, boardW, boardH, trayTop}
  tiles: new Map(),      // id -> {id, text, el, generated, x, y, s, r, rot, slotId, unitId, ...}
  units: new Map(),      // id -> {id, tileIds:[...], ax, ay, vx, vy}  (free tiles only)
  slots: new Map(),      // id -> {id, def, el, px, py, tileId}
  unitSeq: 1,
  zSeq: 10,
  drag: null,            // {unitId, pointerId, dx, dy, removable, samples:[]}
  pending: null,         // press that hasn't crossed the drag threshold yet
  lock: false,
  solvedEver: false,
  revealedHints: [],
  genCounter: 1,
  lastCheckSignature: null,
  rafId: 0,
  boardRect: null,
  highlightTimer: 0,
  glowingEls: [],
  targetedSlots: [],
  progressAll: loadAllProgress(),
};
window.APP = S; // handy for debugging

function persistAllProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S.progressAll)); } catch {}
}

function puzzleProgress(puzzle) {
  return S.progressAll[puzzle.id] || {};
}

/* ------------------------------------------------------------ list view */
function isReleased(puzzle) {
  if (!puzzle.releaseDate) return true;
  const now = new Date();
  const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
  return puzzle.releaseDate <= today;
}

function renderList() {
  const listEl = el("puzzleList");
  listEl.innerHTML = "";
  const released = PUZZLES.filter(isReleased);
  const upcoming = PUZZLES.filter((p) => !isReleased(p)).sort((a, b) => a.releaseDate.localeCompare(b.releaseDate));

  for (const puzzle of released) {
    const progress = puzzleProgress(puzzle);
    const card = document.createElement("button");
    card.className = "puzzleCard";
    const hintsUsed = (progress.hints || []).length;
    const badges = [];
    if (progress.solved) badges.push(`<span class="badge solved">✓ Solved</span>`);
    if (hintsUsed) badges.push(`<span class="badge">💡 ${hintsUsed} hint${hintsUsed > 1 ? "s" : ""} used</span>`);
    if (puzzle.releaseDate) badges.push(`<span class="badge">${puzzle.releaseDate}</span>`);
    if (puzzle.attribution) badges.push(`<span class="badge">by ${escapeHtml(puzzle.attribution)}</span>`);
    card.innerHTML = `
      <div class="cardTitle">${escapeHtml(puzzle.title || puzzle.id)}</div>
      ${puzzle.subtitle ? `<div class="cardSub">${escapeHtml(puzzle.subtitle)}</div>` : ""}
      ${badges.length ? `<div class="cardMeta">${badges.join("")}</div>` : ""}`;
    card.addEventListener("click", () => openPuzzle(puzzle));
    listEl.appendChild(card);
  }

  const note = el("upcomingNote");
  if (upcoming.length) {
    note.hidden = false;
    note.textContent = `${upcoming.length} more puzzle${upcoming.length > 1 ? "s" : ""} coming — next on ${upcoming[0].releaseDate}.`;
  } else {
    note.hidden = true;
  }
  if (!released.length) listEl.innerHTML = `<p class="upcomingNote">No puzzles released yet.</p>`;
}

/* --------------------------------------------------------- open / close */
function openPuzzle(puzzle) {
  S.open = true;
  S.puzzle = puzzle;
  S.tiles.clear(); S.units.clear(); S.slots.clear();
  S.unitSeq = 1; S.zSeq = 10;
  S.drag = null; S.pending = null;
  S.lock = false;
  S.lastCheckSignature = null;
  const progress = puzzleProgress(puzzle);
  S.solvedEver = !!progress.solved;
  S.revealedHints = Array.isArray(progress.hints) ? [...progress.hints] : [];
  S.genCounter = progress.genCounter || 1;

  el("listView").hidden = true;
  el("puzzleView").hidden = false;
  el("puzzleTitle").textContent = puzzle.title || puzzle.id;
  el("solvedBanner").hidden = true;
  el("solvedBanner").innerHTML = "";
  el("hintBtn").hidden = !(puzzle.hints && puzzle.hints.length);
  el("rowBackdrops").innerHTML = "";
  el("slotLayer").innerHTML = "";
  el("tileLayer").innerHTML = "";
  el("fxLayer").innerHTML = "";
  renderPrompt([]);
  window.scrollTo(0, 0);

  buildSlots();
  layoutBoard();
  buildLetterStrip();
  renderTips();

  if (progress.board) restoreBoard(progress.board);
  else dealFreshBoard();

  maybeCheckSolution({ quiet: true });
  cancelAnimationFrame(S.rafId);
  S.rafId = requestAnimationFrame(tick);
}

function closePuzzle() {
  S.open = false;
  cancelAnimationFrame(S.rafId);
  clearHighlights();
  hideToast();
  closeSheet();
  el("puzzleView").hidden = true;
  el("listView").hidden = false;
  renderList();
}

/* --------------------------------------------------------------- layout */
function slotGridExtents() {
  const defs = S.puzzle.slots || [];
  let maxX = 0, maxY = 0;
  for (const d of defs) { maxX = Math.max(maxX, d.x); maxY = Math.max(maxY, d.y); }
  return { maxX, maxY };
}

function layoutBoard() {
  const puzzle = S.puzzle;
  const board = el("board");
  const boardW = board.clientWidth;
  const aspect = puzzle.tileAspect || 1;
  const gap = puzzle.slotGap != null ? puzzle.slotGap : 8;
  const PAD = 16;
  const { maxX, maxY } = slotGridExtents();
  const cols = maxX + 1;

  // Width-filling size for this column count; never clamp *up* past the fit
  // (that would overflow wide grids like crosswords), only cap the max.
  const fitH = ((boardW - 2 * PAD + gap) / cols - gap) / aspect;
  const tileH = clamp(fitH, Math.min(30, fitH), 58);
  const tileW = tileH * aspect;
  const pitchX = tileW + gap, pitchY = tileH + gap;
  const spanW = maxX * pitchX + tileW;
  const offsetX = Math.max(PAD, (boardW - spanW) / 2);
  const offsetY = PAD;
  const slotAreaH = offsetY + maxY * pitchY + tileH + PAD;

  // Tray sized to fit this puzzle's tile count (or a comfy default for generators)
  const tileCount = puzzle.tileGenerator ? 10 : (puzzle.tiles || []).length;
  const trayCols = Math.max(2, Math.floor((boardW - 2 * PAD) / (tileW + 10)));
  const trayRows = Math.max(2, Math.ceil(tileCount / trayCols));
  const trayH = clamp(trayRows * (tileH + 12) + 30, 170, 340);
  const boardH = Math.round(slotAreaH + trayH);

  S.layout = { tileW, tileH, gap, offsetX, offsetY, boardW, boardH, trayTop: slotAreaH, pitchX, pitchY };
  board.style.height = boardH + "px";
  el("trayLine").style.top = slotAreaH + "px";

  for (const slot of S.slots.values()) {
    slot.px = offsetX + slot.def.x * pitchX;
    slot.py = offsetY + slot.def.y * pitchY;
    slot.el.style.left = slot.px + "px";
    slot.el.style.top = slot.py + "px";
    slot.el.style.width = tileW + "px";
    slot.el.style.height = tileH + "px";
    const centerLabelEl = slot.el.querySelector(".slotCenterLabel");
    if (centerLabelEl) {
      const len = centerLabelEl.textContent.length;
      const fontSize = len <= 2 ? tileH * 0.48 : Math.min(tileH * 0.44, (tileW - 12) / (len * 0.62));
      centerLabelEl.style.fontSize = Math.max(9, fontSize) + "px";
    }
  }
  for (const tile of S.tiles.values()) applyTileSize(tile);
  S.boardRect = board.getBoundingClientRect();
}

function handleResize() {
  if (!S.open) return;
  const old = S.layout;
  const fractions = new Map();
  for (const unit of S.units.values()) {
    fractions.set(unit.id, { fx: unit.ax / old.boardW, fy: unit.ay / old.boardH });
  }
  layoutBoard();
  for (const unit of S.units.values()) {
    const f = fractions.get(unit.id);
    if (f) { unit.ax = f.fx * S.layout.boardW; unit.ay = f.fy * S.layout.boardH; }
  }
}
window.addEventListener("resize", handleResize);

/* ------------------------------------------------------- slots & tiles */
function buildSlots() {
  for (const def of S.puzzle.slots || []) {
    const slotEl = document.createElement("div");
    slotEl.className = "slot";
    let labelHtml = "";
    if (def.label != null) labelHtml += `<span class="slotLabel">${escapeHtml(String(def.label))}</span>`;
    if (def.centerLabel != null) labelHtml += `<span class="slotCenterLabel">${escapeHtml(String(def.centerLabel))}</span>`;
    slotEl.innerHTML = labelHtml;
    el("slotLayer").appendChild(slotEl);
    S.slots.set(def.id, { id: def.id, def, el: slotEl, px: 0, py: 0, tileId: null });
  }
}

function applyTileSize(tile) {
  const { tileW, tileH } = S.layout;
  tile.el.style.width = tileW + "px";
  tile.el.style.height = tileH + "px";
  const len = tile.text.length;
  const fontSize = len <= 2 ? tileH * 0.48 : Math.min(tileH * 0.44, (tileW - 12) / (len * 0.62));
  tile.el.style.fontSize = Math.max(10, fontSize) + "px";
}

function createTile(id, text, generated) {
  const tileEl = document.createElement("div");
  tileEl.className = "tile";
  tileEl.textContent = text;
  el("tileLayer").appendChild(tileEl);
  const tile = {
    id, text, el: tileEl, generated: !!generated,
    x: 0, y: 0, s: 1, r: 0,
    rot: (Math.random() - 0.5) * 5,   // resting tilt for free tiles
    slotId: null, unitId: null,
    lastTap: 0, hopAt: 0, pulseAt: 0, dying: false,
  };
  applyTileSize(tile);
  tileEl.addEventListener("pointerdown", (e) => onTilePointerDown(e, tile));
  tileEl.addEventListener("pointermove", (e) => onTilePointerMove(e, tile));
  tileEl.addEventListener("pointerup", (e) => onTilePointerUp(e, tile));
  tileEl.addEventListener("pointercancel", () => abortDrag());
  tileEl.addEventListener("contextmenu", (e) => e.preventDefault());
  S.tiles.set(id, tile);
  return tile;
}

function unitWidth(unit) {
  const n = unit.tileIds.length;
  return n * S.layout.tileW + (n - 1) * CHAIN_GAP;
}

function createUnit(tileIds, ax, ay) {
  const unit = { id: S.unitSeq++, tileIds: [...tileIds], ax, ay, vx: 0, vy: 0 };
  const w = tileIds.length * S.layout.tileW + (tileIds.length - 1) * CHAIN_GAP;
  unit.ax = clamp(unit.ax, 4, S.layout.boardW - w - 4);
  unit.ay = clamp(unit.ay, 4, S.layout.boardH - S.layout.tileH - 4);
  S.units.set(unit.id, unit);
  for (const tid of tileIds) {
    const tile = S.tiles.get(tid);
    tile.unitId = unit.id;
    tile.slotId = null;
  }
  return unit;
}

function bringUnitToFront(unit) {
  S.zSeq += 1;
  for (const tid of unit.tileIds) S.tiles.get(tid).el.style.zIndex = S.zSeq;
}

function trayDealSpot(index) {
  const { tileW, tileH, trayTop, boardW, boardH } = S.layout;
  const cols = Math.max(2, Math.floor((boardW - 32) / (tileW + 10)));
  const col = index % cols, row = Math.floor(index / cols);
  const rowsW = Math.min(cols, 999) * (tileW + 10) - 10;
  const startX = Math.max(10, (boardW - rowsW) / 2);
  return {
    x: clamp(startX + col * (tileW + 10) + (Math.random() - 0.5) * 8, 4, boardW - tileW - 4),
    y: clamp(trayTop + 18 + row * (tileH + 12) + (Math.random() - 0.5) * 6, trayTop + 6, boardH - tileH - 6),
  };
}

function dealFreshBoard() {
  const defs = [...(S.puzzle.tiles || [])];
  for (let i = defs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [defs[i], defs[j]] = [defs[j], defs[i]];
  }
  defs.forEach((def, index) => {
    const tile = createTile(def.id, def.text, false);
    const spot = trayDealSpot(index);
    const unit = createUnit([tile.id], spot.x, spot.y);
    tile.x = spot.x; tile.y = spot.y;
    tile.s = 0.3; tile.pulseAt = performance.now() + index * 25;
    bringUnitToFront(unit);
  });
}

function restoreBoard(saved) {
  for (const def of S.puzzle.tiles || []) createTile(def.id, def.text, false);
  for (const gen of saved.gen || []) createTile(gen.id, gen.text, true);

  for (const [slotId, tileId] of Object.entries(saved.slots || {})) {
    const slot = S.slots.get(slotId);
    const tile = S.tiles.get(tileId);
    if (!slot || !tile || slot.tileId || tile.slotId) continue;
    slot.tileId = tile.id;
    tile.slotId = slot.id;
    tile.x = slot.px; tile.y = slot.py;
  }
  for (const savedUnit of saved.units || []) {
    const tileIds = (savedUnit.tiles || []).filter((tid) => {
      const tile = S.tiles.get(tid);
      return tile && !tile.slotId && !tile.unitId;
    });
    if (!tileIds.length) continue;
    const unit = createUnit(tileIds, (savedUnit.nx || 0) * S.layout.boardW, (savedUnit.ny || 0) * S.layout.boardH);
    unit.tileIds.forEach((tid, i) => {
      const tile = S.tiles.get(tid);
      tile.x = unit.ax + i * (S.layout.tileW + CHAIN_GAP);
      tile.y = unit.ay;
    });
  }
  // Anything unaccounted for (e.g. puzzle definition changed) goes to the tray.
  let dealIndex = 0;
  for (const tile of S.tiles.values()) {
    if (tile.slotId || tile.unitId) continue;
    const spot = trayDealSpot(dealIndex++);
    createUnit([tile.id], spot.x, spot.y);
    tile.x = spot.x; tile.y = spot.y;
  }
}

function saveBoard() {
  const puzzle = S.puzzle;
  const progress = S.progressAll[puzzle.id] || (S.progressAll[puzzle.id] = {});
  progress.solved = S.solvedEver;
  progress.hints = S.revealedHints;
  progress.genCounter = S.genCounter;
  const board = { gen: [], slots: {}, units: [] };
  for (const tile of S.tiles.values()) {
    if (tile.generated && !tile.dying) board.gen.push({ id: tile.id, text: tile.text });
  }
  for (const slot of S.slots.values()) {
    if (slot.tileId && !S.tiles.get(slot.tileId)?.dying) board.slots[slot.id] = slot.tileId;
  }
  for (const unit of S.units.values()) {
    const alive = unit.tileIds.filter((tid) => !S.tiles.get(tid)?.dying);
    if (!alive.length) continue;
    board.units.push({ tiles: alive, nx: unit.ax / S.layout.boardW, ny: unit.ay / S.layout.boardH });
  }
  progress.board = board;
  persistAllProgress();
}

/* -------------------------------------------------------- physics loop */
function unitRect(unit) {
  return { x: unit.ax, y: unit.ay, w: unitWidth(unit), h: S.layout.tileH };
}

function separateUnits() {
  const units = [...S.units.values()];
  const draggedId = S.drag ? S.drag.unitId : -1;
  for (let iter = 0; iter < 2; iter++) {
    for (let i = 0; i < units.length; i++) {
      for (let j = i + 1; j < units.length; j++) {
        const a = units[i], b = units[j];
        const ra = unitRect(a), rb = unitRect(b);
        const overlapX = Math.min(ra.x + ra.w, rb.x + rb.w) - Math.max(ra.x, rb.x) + 2;
        const overlapY = Math.min(ra.y + ra.h, rb.y + rb.h) - Math.max(ra.y, rb.y) + 2;
        if (overlapX <= 0 || overlapY <= 0) continue;
        const pushX = overlapX < overlapY;
        const dir = pushX ? Math.sign((ra.x + ra.w / 2) - (rb.x + rb.w / 2)) || 1
                          : Math.sign((ra.y + ra.h / 2) - (rb.y + rb.h / 2)) || 1;
        const aDragged = a.id === draggedId, bDragged = b.id === draggedId;
        // A dragged tile nudges others gently rather than plowing them away,
        // so you can still sidle up close enough to snap alongside a tile.
        const amount = (pushX ? overlapX : overlapY) * ((aDragged || bDragged) ? 0.16 : 0.5);
        const aShare = aDragged ? 0 : (bDragged ? 1 : 0.5);
        const bShare = 1 - (aDragged ? 0 : (bDragged ? 1 : 0.5));
        if (pushX) { a.ax += dir * amount * aShare; b.ax -= dir * amount * bShare; }
        else { a.ay += dir * amount * aShare; b.ay -= dir * amount * bShare; }
      }
    }
  }
}

function clampUnits() {
  for (const unit of S.units.values()) {
    unit.ax = clamp(unit.ax, 4, S.layout.boardW - unitWidth(unit) - 4);
    unit.ay = clamp(unit.ay, 4, S.layout.boardH - S.layout.tileH - 4);
  }
}

function updateSlotTargets() {
  for (const slotEl of S.targetedSlots) slotEl.classList.remove("target");
  S.targetedSlots = [];
  if (!S.drag) return;
  const unit = S.units.get(S.drag.unitId);
  if (!unit) return;
  const mapping = computeSlotMapping(unit);
  if (!mapping) return;
  for (const [, slot] of mapping) {
    slot.el.classList.add("target");
    S.targetedSlots.push(slot.el);
  }
}

function tick(now) {
  if (!S.open) return;
  const L = S.layout;

  for (const unit of S.units.values()) {
    if (unit.vx || unit.vy) {
      unit.ax += unit.vx; unit.ay += unit.vy;
      unit.vx *= 0.86; unit.vy *= 0.86;
      if (Math.abs(unit.vx) < 0.08) unit.vx = 0;
      if (Math.abs(unit.vy) < 0.08) unit.vy = 0;
    }
  }
  separateUnits();
  clampUnits();
  updateSlotTargets();

  for (const tile of S.tiles.values()) {
    let targetX, targetY, targetRot = 0, targetScale = tile.dying ? 0 : 1;
    const isDragged = S.drag && !tile.slotId && tile.unitId === S.drag.unitId;
    if (tile.slotId) {
      const slot = S.slots.get(tile.slotId);
      targetX = slot.px; targetY = slot.py;
    } else if (tile.unitId != null && S.units.has(tile.unitId)) {
      const unit = S.units.get(tile.unitId);
      const idx = unit.tileIds.indexOf(tile.id);
      targetX = unit.ax + idx * (L.tileW + CHAIN_GAP);
      targetY = unit.ay;
      targetRot = isDragged ? 0 : tile.rot;
      if (isDragged) targetScale = 1.09;
    } else {
      targetX = tile.x; targetY = tile.y;
    }
    const ease = isDragged ? 0.5 : 0.22;
    tile.x += (targetX - tile.x) * ease;
    tile.y += (targetY - tile.y) * ease;
    tile.s += (targetScale - tile.s) * (tile.dying ? 0.35 : 0.25);
    tile.r += (targetRot - tile.r) * 0.2;

    let hop = 0, pulse = 0;
    if (tile.hopAt) {
      const p = (now - tile.hopAt) / 380;
      if (p >= 1) tile.hopAt = 0;
      else if (p > 0) hop = -Math.sin(p * Math.PI) * L.tileH * 0.3;
    }
    if (tile.pulseAt) {
      const p = (now - tile.pulseAt) / 210;
      if (p >= 1) tile.pulseAt = 0;
      else if (p > 0) pulse = Math.sin(p * Math.PI) * 0.11;
    }
    tile.el.style.transform =
      `translate(${tile.x.toFixed(2)}px,${(tile.y + hop).toFixed(2)}px) rotate(${tile.r.toFixed(2)}deg) scale(${(tile.s + pulse).toFixed(3)})`;
  }
  S.rafId = requestAnimationFrame(tick);
}

/* ------------------------------------------------------------- dragging */
function toBoard(e) {
  const r = S.boardRect || el("board").getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function onTilePointerDown(e, tile) {
  if (S.lock || tile.dying || S.drag) return;
  e.preventDefault();
  const now = performance.now();
  if (now - tile.lastTap < DOUBLE_TAP_MS) {
    tile.lastTap = 0;
    handleDoubleTap(tile);
    return;
  }
  tile.lastTap = now;
  S.pending = { tile, pointerId: e.pointerId, startX: e.clientX, startY: e.clientY };
  try { tile.el.setPointerCapture(e.pointerId); } catch {}
}

function beginDrag(e, tile) {
  S.boardRect = el("board").getBoundingClientRect();
  if (tile.slotId) {
    const slot = S.slots.get(tile.slotId);
    slot.tileId = null;
    createUnit([tile.id], tile.x, tile.y);
  }
  const unit = S.units.get(tile.unitId);
  if (!unit) return;
  unit.vx = 0; unit.vy = 0;
  // Offset from the original press point (not this move event), so the tile
  // doesn't jump under the finger on a fast flick.
  const press = { x: S.pending.startX - S.boardRect.left, y: S.pending.startY - S.boardRect.top };
  const removable = !!S.puzzle.tileGenerator && unit.tileIds.every((tid) => S.tiles.get(tid).generated);
  S.drag = { unitId: unit.id, pointerId: e.pointerId, dx: press.x - unit.ax, dy: press.y - unit.ay, removable, samples: [] };
  bringUnitToFront(unit);
  for (const tid of unit.tileIds) S.tiles.get(tid).el.classList.add("lifted");
  if (removable) el("trashZone").classList.add("show");
}

function onTilePointerMove(e, tile) {
  if (S.pending && S.pending.tile === tile && !S.drag) {
    if (Math.hypot(e.clientX - S.pending.startX, e.clientY - S.pending.startY) > DRAG_START_DIST) {
      beginDrag(e, tile);
    }
  }
  if (!S.drag || S.drag.pointerId !== e.pointerId) return;
  const unit = S.units.get(S.drag.unitId);
  if (!unit) return;
  const p = toBoard(e);
  unit.ax = p.x - S.drag.dx;
  unit.ay = p.y - S.drag.dy;
  S.drag.samples.push({ t: performance.now(), x: p.x, y: p.y });
  if (S.drag.samples.length > 6) S.drag.samples.shift();
  if (S.drag.removable) {
    const trash = el("trashZone");
    const tr = trash.getBoundingClientRect();
    const near = Math.hypot(e.clientX - (tr.left + tr.width / 2), e.clientY - (tr.top + tr.height / 2)) < tr.width * 0.9;
    trash.classList.toggle("hot", near);
    S.drag.overTrash = near;
  }
}

function onTilePointerUp(e, tile) {
  if (S.pending && S.pending.tile === tile && !S.drag) { S.pending = null; return; }
  if (!S.drag || S.drag.pointerId !== e.pointerId) return;
  endDrag();
}

function unliftUnit(unit) {
  for (const tid of unit.tileIds) S.tiles.get(tid)?.el.classList.remove("lifted");
}

function abortDrag() {
  if (S.drag) {
    const unit = S.units.get(S.drag.unitId);
    if (unit) unliftUnit(unit);
  }
  S.drag = null;
  S.pending = null;
  el("trashZone").classList.remove("show", "hot");
}

function endDrag() {
  const drag = S.drag;
  const unit = S.units.get(drag.unitId);
  S.drag = null;
  S.pending = null;
  el("trashZone").classList.remove("show", "hot");
  if (!unit) return;
  unliftUnit(unit);

  if (drag.overTrash && drag.removable) {
    removeUnit(unit);
    saveBoard();
    return;
  }
  const mapping = computeSlotMapping(unit);
  if (mapping) {
    placeMapping(unit, mapping);
  } else if (!tryMergeChains(unit)) {
    // Free settle: keep a bit of momentum so tiles slide with weight —
    // but only if the pointer was still moving at release.
    const samples = drag.samples;
    if (samples.length >= 2 && performance.now() - samples[samples.length - 1].t < 90) {
      const first = samples[0], last = samples[samples.length - 1];
      const dt = Math.max(1, last.t - first.t);
      unit.vx = clamp(((last.x - first.x) / dt) * 12, -18, 18);
      unit.vy = clamp(((last.y - first.y) / dt) * 12, -18, 18);
    }
  }
  saveBoard();
  maybeCheckSolution();
}

function handleDoubleTap(tile) {
  if (S.lock || tile.dying) return;
  if (tile.slotId) {
    popTileOutOfSlot(tile);
    saveBoard();
    S.lastCheckSignature = null;
  } else {
    const unit = S.units.get(tile.unitId);
    if (unit && unit.tileIds.length > 1) {
      detachTileFromChain(tile);
      saveBoard();
    } else {
      tile.hopAt = performance.now(); // a playful bounce
    }
  }
}

/* ----------------------------------------- placing, chaining, removing */
function computeSlotMapping(unit) {
  const L = S.layout;
  const radius = Math.max(L.tileW, L.tileH) * 0.7;
  const used = new Set();
  const mapping = [];
  const single = unit.tileIds.length === 1;
  for (let i = 0; i < unit.tileIds.length; i++) {
    const tile = S.tiles.get(unit.tileIds[i]);
    const cx = unit.ax + i * (L.tileW + CHAIN_GAP) + L.tileW / 2;
    const cy = unit.ay + L.tileH / 2;
    let best = null, bestDist = radius;
    for (const slot of S.slots.values()) {
      if (used.has(slot.id)) continue;
      if (slot.tileId && !single) continue; // groups need empty slots; singles may swap
      const d = Math.hypot(slot.px + L.tileW / 2 - cx, slot.py + L.tileH / 2 - cy);
      if (d < bestDist) { bestDist = d; best = slot; }
    }
    if (!best) return null;
    used.add(best.id);
    mapping.push([tile, best]);
  }
  return mapping;
}

function placeMapping(unit, mapping) {
  S.units.delete(unit.id);
  const now = performance.now();
  for (const [tile, slot] of mapping) {
    if (slot.tileId) {  // swap: evicted tile pops out below the slot
      const evicted = S.tiles.get(slot.tileId);
      if (evicted) popTileOutOfSlot(evicted);
    }
    tile.unitId = null;
    tile.slotId = slot.id;
    slot.tileId = tile.id;
    tile.pulseAt = now;
    S.zSeq += 1;
    tile.el.style.zIndex = 5;
  }
}

function popTileOutOfSlot(tile) {
  const slot = S.slots.get(tile.slotId);
  if (slot) slot.tileId = null;
  tile.slotId = null;
  tile.rot = (Math.random() - 0.5) * 6;
  const unit = createUnit([tile.id], tile.x + (Math.random() - 0.5) * 24, tile.y + S.layout.tileH * 1.1);
  bringUnitToFront(unit);
}

function chainingEnabled() {
  const puzzle = S.puzzle;
  if (puzzle.chainTiles != null) return !!puzzle.chainTiles;
  return !!puzzle.tileGenerator;
}

function tryMergeChains(unit) {
  if (!chainingEnabled()) return false;
  const L = S.layout;
  const maxDx = L.tileW * 0.55, maxDy = L.tileH * 0.55;
  let best = null;
  for (const other of S.units.values()) {
    if (other.id === unit.id) continue;
    // attach `unit` to the right end of `other`
    const rightX = other.ax + unitWidth(other) + CHAIN_GAP;
    const dRight = Math.hypot(unit.ax - rightX, unit.ay - other.ay);
    if (Math.abs(unit.ax - rightX) < maxDx && Math.abs(unit.ay - other.ay) < maxDy && (!best || dRight < best.d)) {
      best = { d: dRight, other, side: "right" };
    }
    // attach `unit` to the left end of `other`
    const leftX = other.ax - unitWidth(unit) - CHAIN_GAP;
    const dLeft = Math.hypot(unit.ax - leftX, unit.ay - other.ay);
    if (Math.abs(unit.ax - leftX) < maxDx && Math.abs(unit.ay - other.ay) < maxDy && (!best || dLeft < best.d)) {
      best = { d: dLeft, other, side: "left" };
    }
  }
  if (!best) return false;
  const { other, side } = best;
  const tileIds = side === "right" ? [...other.tileIds, ...unit.tileIds] : [...unit.tileIds, ...other.tileIds];
  const anchorX = side === "right" ? other.ax : other.ax - unitWidth(unit) - CHAIN_GAP;
  const anchorY = other.ay;
  S.units.delete(unit.id);
  S.units.delete(other.id);
  const merged = createUnit(tileIds, anchorX, anchorY);
  bringUnitToFront(merged);
  const now = performance.now();
  for (const tid of tileIds) {
    const tile = S.tiles.get(tid);
    tile.rot = 0;
    tile.pulseAt = now;
  }
  return true;
}

function detachTileFromChain(tile) {
  const unit = S.units.get(tile.unitId);
  const L = S.layout;
  const index = unit.tileIds.indexOf(tile.id);
  const leftIds = unit.tileIds.slice(0, index);
  const rightIds = unit.tileIds.slice(index + 1);
  S.units.delete(unit.id);
  if (leftIds.length) createUnit(leftIds, unit.ax, unit.ay);
  tile.rot = (Math.random() - 0.5) * 8;
  const popped = createUnit([tile.id], unit.ax + index * (L.tileW + CHAIN_GAP), unit.ay + L.tileH * 0.95);
  bringUnitToFront(popped);
  if (rightIds.length) createUnit(rightIds, unit.ax + (index + 1) * (L.tileW + CHAIN_GAP), unit.ay);
}

function removeUnit(unit) {
  S.units.delete(unit.id);
  for (const tid of unit.tileIds) {
    const tile = S.tiles.get(tid);
    tile.dying = true;
    setTimeout(() => { tile.el.remove(); S.tiles.delete(tid); }, 260);
  }
}

/* -------------------------------------------------------- letter strip */
function buildLetterStrip() {
  const strip = el("letterStrip");
  const generator = S.puzzle.tileGenerator;
  if (!generator || S.lock) { strip.hidden = true; strip.innerHTML = ""; return; }
  strip.hidden = false;
  strip.innerHTML = "";
  const letters = generator.letters || "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for (const letter of letters) {
    const key = document.createElement("button");
    key.className = "key";
    key.textContent = letter;
    key.addEventListener("click", () => spawnLetterTile(letter));
    strip.appendChild(key);
  }
}

function spawnLetterTile(letter) {
  if (S.lock) return;
  const { tileW, tileH, trayTop, boardW, boardH } = S.layout;
  const id = `gen-${S.genCounter++}`;
  const tile = createTile(id, letter, true);
  const x = boardW / 2 - tileW / 2 + (Math.random() - 0.5) * boardW * 0.4;
  const y = trayTop + 20 + Math.random() * Math.max(20, boardH - trayTop - tileH - 44);
  const unit = createUnit([tile.id], x, y);
  tile.x = unit.ax; tile.y = unit.ay;
  tile.s = 0.2;
  tile.pulseAt = performance.now();
  bringUnitToFront(unit);
  saveBoard();
}

function removeNewestFreeGeneratedTile() {
  let newest = null;
  for (const unit of S.units.values()) {
    if (unit.tileIds.length !== 1) continue;
    const tile = S.tiles.get(unit.tileIds[0]);
    if (!tile.generated || tile.dying) continue;
    if (!newest || tile.id > newest.tile.id) newest = { unit, tile };
  }
  if (newest) { removeUnit(newest.unit); saveBoard(); }
}

document.addEventListener("keydown", (e) => {
  if (!S.open || S.lock || !S.puzzle.tileGenerator) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[a-z]$/i.test(e.key)) spawnLetterTile(e.key.toUpperCase());
  else if (e.key === "Backspace") removeNewestFreeGeneratedTile();
});

function renderTips() {
  const parts = ["Drag tiles into slots", "double-tap a placed tile to pop it out"];
  if (chainingEnabled()) parts.push("tiles snap side-by-side into words you can drag as one");
  if (S.puzzle.tileGenerator) parts.push("tap or type letters to add tiles, drop them on ✕ to remove");
  el("tipsLine").textContent = parts.join(" · ") + ".";
}

/* ---------------------------------------------------- solution checking */
function tileTextInSlot(slotId) {
  const slot = S.slots.get(slotId);
  const tile = slot && slot.tileId ? S.tiles.get(slot.tileId) : null;
  return tile ? tile.text.toUpperCase() : null;
}

function evaluateChecks() {
  const checks = S.puzzle.checks || [];
  if (!checks.length) return false;
  return checks.every((check) => {
    if (check.type === "any") return true;  // solved once every slot is filled, whatever the tiles
    if (check.type === "slots") {
      return Object.entries(check.answers).every(([slotId, accepted]) => {
        const text = tileTextInSlot(slotId);
        if (text == null) return false;
        const acceptedList = Array.isArray(accepted) ? accepted : [accepted];
        return acceptedList.some((a) => String(a).toUpperCase() === text);
      });
    }
    if (check.type === "categories") {
      return matchCategories(check) != null;
    }
    return false;
  });
}

// Returns [{groupIndex, categoryIndex}] if every slot group holds exactly one
// full category (any group order), else null.
function matchCategories(check) {
  const remaining = check.categories.map((_, i) => i);
  const matches = [];
  for (let g = 0; g < check.slotGroups.length; g++) {
    const texts = check.slotGroups[g].map(tileTextInSlot);
    if (texts.some((t) => t == null)) return null;
    const sorted = [...texts].sort();
    const foundIdx = remaining.find((ci) => {
      const cat = check.categories[ci].tiles.map((t) => t.toUpperCase()).sort();
      return cat.length === sorted.length && cat.every((t, i) => t === sorted[i]);
    });
    if (foundIdx === undefined) return null;
    remaining.splice(remaining.indexOf(foundIdx), 1);
    matches.push({ groupIndex: g, categoryIndex: foundIdx });
  }
  return matches;
}

function maybeCheckSolution(options = {}) {
  if (S.lock) return;
  const allFilled = [...S.slots.values()].every((slot) => slot.tileId);
  if (!allFilled) { S.lastCheckSignature = null; return; }
  const signature = JSON.stringify([...S.slots.values()].map((slot) => slot.tileId));
  if (signature === S.lastCheckSignature) return;
  S.lastCheckSignature = signature;
  if (evaluateChecks()) {
    onSolved(!options.quiet);
  } else if (!options.quiet) {
    const board = el("board");
    board.classList.remove("shake");
    void board.offsetWidth;
    board.classList.add("shake");
  }
}

function onSolved(celebrate) {
  S.lock = true;
  S.solvedEver = true;
  saveBoard();
  el("letterStrip").hidden = true;
  for (const tile of S.tiles.values()) tile.el.classList.add("locked");

  const banner = el("solvedBanner");
  const hintsUsed = S.revealedHints.length;
  let chips = "";
  for (const check of S.puzzle.checks || []) {
    if (check.type !== "categories") continue;
    const matches = matchCategories(check) || [];
    colorizeCategoryRows(check, matches);
    chips = matches
      .sort((a, b) => a.groupIndex - b.groupIndex)
      .map(({ categoryIndex }) =>
        `<span class="chip" style="background:${CATEGORY_COLORS[categoryIndex % CATEGORY_COLORS.length]}">${escapeHtml(check.categories[categoryIndex].label || "")}</span>`)
      .join("");
  }
  banner.innerHTML = `🎉 Solved! ${chips}<span class="muted">${hintsUsed ? `${hintsUsed} hint${hintsUsed > 1 ? "s" : ""} used` : "no hints used"}</span>`;
  banner.hidden = false;

  if (celebrate) {
    const placedTiles = [...S.slots.values()]
      .filter((slot) => slot.tileId)
      .sort((a, b) => (a.py - b.py) || (a.px - b.px))
      .map((slot) => S.tiles.get(slot.tileId));
    const now = performance.now();
    placedTiles.forEach((tile, i) => { if (tile) tile.hopAt = now + 120 + i * 55; });
    launchConfetti();
  }
}

function colorizeCategoryRows(check, matches) {
  const layer = el("rowBackdrops");
  layer.innerHTML = "";
  const L = S.layout;
  for (const { groupIndex, categoryIndex } of matches) {
    const slots = check.slotGroups[groupIndex].map((id) => S.slots.get(id)).filter(Boolean);
    if (!slots.length) continue;
    const minX = Math.min(...slots.map((s) => s.px)), maxX = Math.max(...slots.map((s) => s.px + L.tileW));
    const minY = Math.min(...slots.map((s) => s.py)), maxY = Math.max(...slots.map((s) => s.py + L.tileH));
    const pad = 5;
    const backdrop = document.createElement("div");
    backdrop.className = "rowBackdrop";
    backdrop.style.cssText =
      `left:${minX - pad}px; top:${minY - pad}px; width:${maxX - minX + pad * 2}px; height:${maxY - minY + pad * 2}px;` +
      `background:${CATEGORY_COLORS[categoryIndex % CATEGORY_COLORS.length]};`;
    layer.appendChild(backdrop);
  }
}

function launchConfetti() {
  const layer = el("fxLayer");
  const colors = ["#f5c84c", "#93c464", "#7cb7e0", "#b58fd9", "#e2704a", "#fffdf8"];
  const { boardW, boardH } = S.layout;
  for (let i = 0; i < 80; i++) {
    const piece = document.createElement("div");
    const size = 5 + Math.random() * 6;
    const x = Math.random() * boardW;
    piece.style.cssText =
      `position:absolute; left:0; top:0; width:${size}px; height:${size * (0.5 + Math.random())}px;` +
      `background:${colors[i % colors.length]}; border-radius:2px; opacity:0;`;
    layer.appendChild(piece);
    const drift = (Math.random() - 0.5) * 160;
    piece.animate([
      { transform: `translate(${x}px, -20px) rotate(0deg)`, opacity: 1 },
      { transform: `translate(${x + drift}px, ${boardH + 30}px) rotate(${540 + Math.random() * 540}deg)`, opacity: 0.9 },
    ], { duration: 1300 + Math.random() * 1100, delay: Math.random() * 350, easing: "cubic-bezier(.25,.4,.6,1)" })
      .onfinish = () => piece.remove();
  }
}

/* ----------------------------------------------------------------- hints */
function hintSizesInOrder() {
  const sizes = [];
  for (const hint of S.puzzle.hints || []) {
    if (!sizes.includes(hint.size)) sizes.push(hint.size);
  }
  return sizes;
}

function openSheet() {
  renderHintSheet();
  el("sheetScrim").hidden = false;
  el("hintSheet").hidden = false;
  requestAnimationFrame(() => {
    el("sheetScrim").classList.add("open");
    el("hintSheet").classList.add("open");
  });
}

function closeSheet() {
  el("sheetScrim").classList.remove("open");
  el("hintSheet").classList.remove("open");
  setTimeout(() => { el("sheetScrim").hidden = true; el("hintSheet").hidden = true; }, 280);
}

function renderHintSheet() {
  const hints = S.puzzle.hints || [];
  const buttonsEl = el("hintButtons");
  buttonsEl.innerHTML = "";
  for (const size of hintSizesInOrder()) {
    const total = hints.filter((h) => h.size === size).length;
    const used = S.revealedHints.filter((i) => hints[i] && hints[i].size === size).length;
    const remaining = total - used;
    const button = document.createElement("button");
    button.className = "hbtn";
    button.disabled = remaining <= 0;
    button.textContent = `${size[0].toUpperCase() + size.slice(1)} hint · ${remaining} left`;
    button.addEventListener("click", () => {
      if (!button.classList.contains("armed")) {
        button.classList.add("armed");
        button.textContent = `Reveal ${size} hint?`;
        setTimeout(() => { if (buttonsEl.contains(button)) renderHintSheet(); }, 2500);
        return;
      }
      revealNextHint(size);
    });
    buttonsEl.appendChild(button);
  }

  const revealedEl = el("revealedHints");
  revealedEl.innerHTML = "";
  if (!S.revealedHints.length) {
    revealedEl.innerHTML = `<p class="sheetSub">No hints revealed yet.</p>`;
    return;
  }
  for (const index of S.revealedHints) {
    const hint = hints[index];
    if (!hint) continue;
    const item = document.createElement("button");
    item.className = "revealedHint";
    item.innerHTML = `<span class="hintSize">${escapeHtml(hint.size)} hint</span>${escapeHtml(hint.text)}` +
      (hint.highlight ? ` <span class="replay">· tap to show highlights</span>` : "");
    item.addEventListener("click", () => { closeSheet(); applyHint(hint); });
    revealedEl.appendChild(item);
  }
}

function revealNextHint(size) {
  const hints = S.puzzle.hints || [];
  const index = hints.findIndex((h, i) => h.size === size && !S.revealedHints.includes(i));
  if (index < 0) return;
  S.revealedHints.push(index);
  saveBoard();
  closeSheet();
  applyHint(hints[index]);
}

function applyHint(hint) {
  clearHighlights();
  showToast(hint.text);
  const highlight = hint.highlight || {};
  const promptMarks = typeof highlight.prompt === "string" ? [highlight.prompt] : (highlight.prompt || []);
  renderPrompt(promptMarks);
  for (const slotId of highlight.slots || []) {
    const slot = S.slots.get(slotId);
    if (slot) { slot.el.classList.add("glow"); S.glowingEls.push(slot.el); }
  }
  for (const key of highlight.tiles || []) {
    for (const tile of S.tiles.values()) {
      if (tile.id === key || tile.text.toUpperCase() === String(key).toUpperCase()) {
        tile.el.classList.add("glow");
        S.glowingEls.push(tile.el);
      }
    }
  }
  clearTimeout(S.highlightTimer);
  S.highlightTimer = setTimeout(clearHighlights, 8000);
}

function clearHighlights() {
  clearTimeout(S.highlightTimer);
  for (const glowEl of S.glowingEls) glowEl.classList.remove("glow");
  S.glowingEls = [];
  if (S.open) renderPrompt([]);
}

function renderPrompt(marks) {
  const text = S.puzzle && S.puzzle.prompt ? S.puzzle.prompt : "";
  const lower = text.toLowerCase();
  const ranges = [];
  for (const mark of marks) {
    const idx = lower.indexOf(String(mark).toLowerCase());
    if (idx >= 0) ranges.push([idx, idx + mark.length]);
  }
  ranges.sort((a, b) => a[0] - b[0]);
  let html = "", cursor = 0;
  for (const [start, end] of ranges) {
    if (start < cursor) continue;
    html += escapeHtml(text.slice(cursor, start)) + "<mark>" + escapeHtml(text.slice(start, end)) + "</mark>";
    cursor = end;
  }
  html += escapeHtml(text.slice(cursor));
  if (S.puzzle && S.puzzle.attribution) {
    html += `<span class="attribution">— ${escapeHtml(S.puzzle.attribution)}</span>`;
  }
  el("promptCard").innerHTML = html;
}

function showToast(text) {
  el("hintToastText").textContent = text;
  el("hintToast").hidden = false;
}
function hideToast() { el("hintToast").hidden = true; }

/* ------------------------------------------------------------ controls */
function resetBoard() {
  clearHighlights();
  hideToast();
  const progress = S.progressAll[S.puzzle.id];
  if (progress) delete progress.board;
  persistAllProgress();
  for (const tile of S.tiles.values()) tile.el.remove();
  S.tiles.clear(); S.units.clear();
  for (const slot of S.slots.values()) slot.tileId = null;
  S.lock = false;
  S.lastCheckSignature = null;
  el("solvedBanner").hidden = true;
  el("rowBackdrops").innerHTML = "";
  buildLetterStrip();
  dealFreshBoard();
  saveBoard();
}

el("backBtn").addEventListener("click", closePuzzle);
el("hintBtn").addEventListener("click", openSheet);
el("sheetScrim").addEventListener("click", closeSheet);
el("hintToast").addEventListener("click", () => { hideToast(); clearHighlights(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeSheet(); hideToast(); } });

const resetButton = el("resetBtn");
resetButton.addEventListener("click", () => {
  if (!resetButton.classList.contains("armed")) {
    resetButton.classList.add("armed");
    resetButton.textContent = "Reset?";
    setTimeout(() => { resetButton.classList.remove("armed"); resetButton.textContent = "↺"; }, 2200);
    return;
  }
  resetButton.classList.remove("armed");
  resetButton.textContent = "↺";
  resetBoard();
});

/* ---------------------------------------------------------------- init */
renderList();
</script>
